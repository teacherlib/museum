<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบบันทึกการเยี่ยมชมพิพิธภัณฑ์ รร.ตท.สปท.</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Sarabun',sans-serif;background:#f8f0ff}
    .btn-purple{background:#9333ea;transition:.2s}.btn-purple:hover{background:#7e22ce}
    #toast{display:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:1000;padding:12px 20px;border-radius:12px;color:white;box-shadow:0 4px 15px #0003;max-width:90%;text-align:center}
    #toast.show{display:block}
    @media print{
      body{background:white!important;padding:0!important}
      #loginOverlay,#formSection,#filterSection,#logoutBtn,#toast,.no-print{display:none!important}
      #mainContent{box-shadow:none!important;border:0!important;opacity:1!important;max-width:none!important}
      #reportTable{font-size:10pt}
      #reportTable th,#reportTable td{border:1px solid #ddd;padding:6px}
      .print-title{display:block!important}
    }
    .print-title{display:none}
  </style>
</head>
<body class="p-4">
  <div id="toast" role="status" aria-live="polite"></div>

  <div id="loginOverlay" class="fixed inset-0 bg-purple-900/80 z-50 flex items-center justify-center p-4">
    <form id="loginForm" class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border-t-8 border-purple-600 text-center">
      <h2 class="text-2xl font-bold text-gray-800 mb-4">เข้าสู่ระบบพิพิธภัณฑ์</h2>
      <div class="space-y-4">
        <input type="text" id="userInput" autocomplete="username" required placeholder="ชื่อผู้ใช้" class="w-full border border-purple-200 rounded-lg p-3 outline-none focus:ring-2 focus:ring-purple-500">
        <input type="password" id="passInput" autocomplete="current-password" required placeholder="รหัสผ่าน" class="w-full border border-purple-200 rounded-lg p-3 outline-none focus:ring-2 focus:ring-purple-500">
        <button id="loginBtn" class="w-full btn-purple text-white py-3 rounded-lg font-bold shadow-lg">ยืนยันตัวตน</button>
        <p id="loginError" class="text-red-500 text-sm hidden"></p>
      </div>
    </form>
  </div>

  <main id="mainContent" class="hidden max-w-5xl mx-auto bg-white shadow-2xl rounded-2xl overflow-hidden border border-purple-200">
    <header class="bg-purple-700 p-6 text-white flex justify-between items-center gap-3">
      <div><h1 class="text-2xl font-bold">บันทึกการเยี่ยมชมพิพิธภัณฑ์</h1><p class="text-sm opacity-90">โรงเรียนเตรียมทหาร สถาบันวิชาการป้องกันประเทศ</p></div>
      <button id="logoutBtn" type="button" class="bg-purple-800 hover:bg-purple-900 px-4 py-2 rounded-full text-xs border border-purple-400 font-bold">ออกจากระบบ</button>
    </header>

    <section id="formSection" class="p-6 border-b border-purple-100">
      <form id="museumForm" class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="md:col-span-2">
          <label for="groupName" class="text-purple-800 font-bold text-sm">ชื่อคณะเยี่ยมชม <span class="text-red-500">*</span></label>
          <input type="text" id="groupName" required maxlength="200" class="w-full border border-purple-200 rounded p-2.5 focus:ring-2 focus:ring-purple-400 outline-none">
        </div>
        <div>
          <label for="visitorCount" class="text-purple-800 font-bold text-sm">จำนวนผู้เยี่ยมชม (คน) <span class="text-red-500">*</span></label>
          <input type="number" id="visitorCount" required min="1" step="1" class="w-full border border-purple-200 rounded p-2.5 focus:ring-2 focus:ring-purple-400 outline-none">
        </div>
        <div>
          <label for="visitDateTime" class="text-purple-800 font-bold text-sm">วันที่และเวลา <span class="text-red-500">*</span></label>
          <input type="datetime-local" id="visitDateTime" required class="w-full border border-purple-200 rounded p-2.5 focus:ring-2 focus:ring-purple-400 outline-none">
        </div>
        <div class="md:col-span-3">
          <label for="packageType" class="text-purple-800 font-bold text-sm">ชุดการต้อนรับคณะ <span class="text-red-500">*</span></label>
          <select id="packageType" required class="w-full border border-purple-200 rounded p-2.5 focus:ring-2 focus:ring-purple-400 outline-none">
            <option value="ชุดที่ 1: พ.ท.หญิง อภิวรรณฯ (หน.ชุด)">ชุดที่ 1: พ.ท.หญิง อภิวรรณฯ (หน.ชุด)</option>
            <option value="ชุดที่ 2: พ.ท.หญิง รุ่งนภาฯ (หน.ชุด)">ชุดที่ 2: พ.ท.หญิง รุ่งนภาฯ (หน.ชุด)</option>
            <option value="ชุดที่ 3: ร.ท.ธนากรฯ (หน.ชุด)">ชุดที่ 3: ร.ท.ธนากรฯ (หน.ชุด)</option>
          </select>
        </div>
        <div class="flex items-end"><button id="submitBtn" type="submit" class="w-full btn-purple text-white p-2.5 rounded-lg font-bold shadow-md">บันทึกข้อมูล</button></div>
      </form>
    </section>

    <section id="filterSection" class="bg-purple-100 p-4 flex flex-col md:flex-row justify-between items-center gap-4 border-t border-purple-100">
      <div class="flex flex-wrap items-center gap-2">
        <span class="text-purple-900 font-bold">ช่วงเวลา:</span>
        <input type="date" id="startDate" aria-label="วันที่เริ่มต้น" class="rounded border-purple-300 p-2 text-sm">
        <span class="text-purple-500">ถึง</span>
        <input type="date" id="endDate" aria-label="วันที่สิ้นสุด" class="rounded border-purple-300 p-2 text-sm">
        <button id="filterBtn" type="button" class="bg-purple-600 text-white px-3 py-2 rounded text-sm hover:bg-purple-700">กรองข้อมูล</button>
        <button id="allBtn" type="button" class="text-purple-700 px-3 py-2 text-sm hover:underline">แสดงทั้งหมด</button>
      </div>
      <button id="printBtn" type="button" class="bg-red-500 text-white px-4 py-2 rounded-lg shadow font-bold hover:bg-red-600">พิมพ์ / บันทึก PDF</button>
    </section>

    <section class="p-4 overflow-x-auto min-h-[250px]">
      <h2 class="print-title text-center text-xl font-bold mb-4">รายงานการเยี่ยมชมพิพิธภัณฑ์ โรงเรียนเตรียมทหาร สถาบันวิชาการป้องกันประเทศ</h2>
      <div class="flex justify-between text-sm text-gray-500 mb-2"><span id="recordCount">0 รายการ</span><span id="loadingText"></span></div>
      <table class="w-full text-left" id="reportTable">
        <thead class="bg-purple-50 text-purple-800 border-b-2 border-purple-200"><tr>
          <th class="p-3">วันที่/เวลา (พ.ศ.)</th><th class="p-3">คณะเยี่ยมชม</th><th class="p-3 text-center">จำนวน (คน)</th><th class="p-3">ชุดการต้อนรับ</th>
        </tr></thead>
        <tbody id="tableBody" class="divide-y divide-purple-50 text-sm"><tr><td colspan="4" class="text-center py-10 text-gray-400">กรุณาเข้าสู่ระบบ</td></tr></tbody>
      </table>
    </section>
  </main>

<script>
  let authToken = sessionStorage.getItem('museumToken') || '';
  let allData = [];
  let visibleData = [];

  const $ = id => document.getElementById(id);

  function toast(message, type='success') {
    const el = $('toast'); el.textContent = message;
    el.style.background = type === 'success' ? '#059669' : '#dc2626';
    el.classList.add('show'); clearTimeout(toast.timer);
    toast.timer = setTimeout(() => el.classList.remove('show'), 3500);
  }
  function setBusy(button, busy, label) {
    button.disabled = busy; button.textContent = busy ? label : button.dataset.original;
    button.classList.toggle('opacity-60', busy); button.classList.toggle('cursor-not-allowed', busy);
  }
  function callServer(method, ...args) {
    return new Promise((resolve, reject) => {
      if (!google || !google.script || !google.script.run) {
        reject(new Error('กรุณาเปิดระบบผ่าน URL ของ Google Apps Script Web App'));
        return;
      }
      google.script.run.withSuccessHandler(resolve).withFailureHandler(err => reject(new Error(err.message || String(err))))[method](...args);
    });
  }
  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function parseDate(value) {
    if (!value) return null;
    const d = new Date(value);
    return Number.isNaN(d.getTime()) ? null : d;
  }
  function formatThaiDate(value) {
    const d = parseDate(value); if (!d) return value || '-';
    return new Intl.DateTimeFormat('th-TH-u-ca-buddhist', {
      day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:false
    }).format(d);
  }
  function showApp() {
    $('loginOverlay').classList.add('hidden');
    $('mainContent').classList.remove('hidden');
  }
  async function login(event) {
    event.preventDefault();
    const btn = $('loginBtn'); btn.dataset.original = 'ยืนยันตัวตน';
    setBusy(btn, true, 'กำลังตรวจสอบ...');
    $('loginError').classList.add('hidden');
    try {
      const result = await callServer('checkLogin', $('userInput').value.trim(), $('passInput').value);
      if (!result || !result.success) throw new Error(result?.message || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
      authToken = result.token; sessionStorage.setItem('museumToken', authToken);
      showApp(); await fetchData(); $('passInput').value = '';
    } catch (err) {
      $('loginError').textContent = err.message || 'เข้าสู่ระบบไม่สำเร็จ';
      $('loginError').classList.remove('hidden');
    } finally { setBusy(btn, false, ''); }
  }
  async function fetchData() {
    $('loadingText').textContent = 'กำลังโหลดข้อมูล...';
    try {
      allData = await callServer('getVisits', authToken);
      visibleData = [...allData]; renderTable(visibleData);
    } catch (err) {
      if ((err.message || '').includes('เซสชันหมดอายุ')) logout(false);
      toast(err.message || 'โหลดข้อมูลไม่สำเร็จ', 'error');
    } finally { $('loadingText').textContent = ''; }
  }
  function renderTable(rows) {
    const tbody = $('tableBody'); tbody.replaceChildren();
    $('recordCount').textContent = `${rows.length} รายการ`;
    if (!rows.length) {
      const tr = document.createElement('tr'); const td = document.createElement('td');
      td.colSpan = 4; td.className = 'text-center py-10 text-gray-400'; td.textContent = 'ไม่พบข้อมูล';
      tr.appendChild(td); tbody.appendChild(tr); return;
    }
    rows.forEach(row => {
      const tr = document.createElement('tr'); tr.className = 'hover:bg-purple-50';
      [formatThaiDate(row.visitDateTime), row.groupName, row.visitorCount, row.packageType].forEach((value, index) => {
        const td = document.createElement('td'); td.className = 'p-3';
        if (index === 2) td.classList.add('text-center');
        if (index === 1) td.classList.add('font-bold','text-purple-700');
        td.textContent = value ?? '-'; tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }
  function filterData() {
    const start = $('startDate').value, end = $('endDate').value;
    if (!start || !end) return toast('กรุณาระบุวันที่เริ่มต้นและสิ้นสุด', 'error');
    if (start > end) return toast('วันที่เริ่มต้นต้องไม่อยู่หลังวันที่สิ้นสุด', 'error');
    visibleData = allData.filter(row => {
      const d = parseDate(row.visitDateTime); if (!d) return false;
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      return key >= start && key <= end;
    });
    renderTable(visibleData);
  }
  async function saveForm(event) {
    event.preventDefault();
    const btn = $('submitBtn'); btn.dataset.original = 'บันทึกข้อมูล';
    setBusy(btn, true, 'กำลังบันทึก...');
    const payload = {
      groupName: $('groupName').value.trim(),
      visitorCount: $('visitorCount').value,
      visitDateTime: $('visitDateTime').value,
      packageType: $('packageType').value
    };
    try {
      const result = await callServer('saveVisit', authToken, payload);
      $('museumForm').reset(); toast(result.message || 'บันทึกข้อมูลสำเร็จ');
      await fetchData();
    } catch (err) { toast(err.message || 'บันทึกข้อมูลไม่สำเร็จ', 'error'); }
    finally { setBusy(btn, false, ''); }
  }
  function logout(reload=true) {
    authToken = ''; sessionStorage.removeItem('museumToken');
    $('mainContent').classList.add('hidden'); $('loginOverlay').classList.remove('hidden');
    if (reload) $('passInput').value = '';
  }

  $('loginForm').addEventListener('submit', login);
  $('museumForm').addEventListener('submit', saveForm);
  $('filterBtn').addEventListener('click', filterData);
  $('allBtn').addEventListener('click', () => { visibleData = [...allData]; renderTable(visibleData); });
  $('printBtn').addEventListener('click', () => window.print());
  $('logoutBtn').addEventListener('click', () => logout());

  window.addEventListener('load', async () => {
    if (authToken) {
      showApp();
      await fetchData();
      if (!authToken) return;
    }
  });
</script>
</body>
</html>
